<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Explorer</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      color: black;
      text-align: center;
      margin: 0;
      transition: 0.3s;
    }

    h1 {
      margin: 20px;
    }

    .controls {
      margin: 20px;
    }

    input, select, button {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: none;
      outline: none;
      cursor: pointer;
    }

    button {
      background: #ff4b2b;
      color: white;
    }

    #movies {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
    }

    .card {
      background: white;
      color: black;
      margin: 15px;
      padding: 10px;
      width: 200px;
      border-radius: 10px;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform: scale(1.05);
    }

    img {
      width: 100%;
      border-radius: 5px;
    }

    .loading {
      font-size: 20px;
      margin-top: 20px;
    }

    /* Dark Mode */
    .dark {
      background: #121212;
      color: white;
    }

    .dark .card {
      background: #1e1e1e;
      color: white;
    }
  </style>
</head>
<body>

  <h1>🎬 Movie Explorer</h1>

  <!-- Buttons -->
  <button onclick="toggleTheme()">Toggle Dark Mode</button>
  <button onclick="showFavorites()">Show Favorites</button>

  <div class="controls">
    <!-- Search -->
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search movies..."
    >

    <!-- Sort -->
    <select id="sort">
      <option value="">Sort</option>
      <option value="az">A-Z</option>
      <option value="za">Z-A</option>
    </select>

    <!-- Filter -->
    <select id="filterYear">
      <option value="">Filter by Year</option>
      <option value="old">Before 2015</option>
      <option value="new">After 2015</option>
    </select>
  </div>

  <!-- Movies -->
  <div id="movies"></div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
